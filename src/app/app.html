<app-toast />
<app-loader />
@if (currentUser(); as user) {
  <header class="app-header">
    <nav class="app-navigation" aria-label="Main navigation">
      <a routerLink="/dashboard">Dashboard</a>
      <a routerLink="/attributes">Attribute List</a>
    </nav>
    <div class="user-profile">
      <span class="username">{{ user.username }}</span>
      <span class="role-badge" [appActiveStatus]="user.role">{{ user.role }}</span>
    </div>
    @if (user.role === 'Admin') {
      <a routerLink="/admin/errors">Error log</a>
    }
    <button class="logout-button" type="button" (click)="logout()">Logout</button>
  </header>
}
<router-outlet /> 
<!-- this is where angular displays the component corresponsdinf to the current URL -->
